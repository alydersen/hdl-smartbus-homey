<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 24px;
      color: #222;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 1.2em;
    }
    p.intro {
      margin: 0 0 20px;
      color: #666;
    }
    button.choice {
      display: block;
      width: 100%;
      margin: 0 0 4px;
      padding: 14px;
      font-size: 1em;
      text-align: left;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    button.choice:hover {
      background: #f2f2f2;
    }
    p.hint {
      margin: 0 0 16px;
      color: #888;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <h2>Add floor heating devices</h2>
  <p class="intro">How do you want to add devices?</p>

  <button id="search" class="choice">Search for devices</button>
  <p class="hint">Heating zones and the controller's built-in sensor channels (including the outdoor temperature on channel 13).</p>

  <button id="probe" class="choice">Add a digital temperature sensor probe</button>
  <p class="hint">For digital sensors with a factory-set probe ID. The probe reports on channel 50 + the probe ID, so you can enter any ID here.</p>

  <script type="application/javascript">
    (function () {
      function fail(err) {
        Homey.alert((err && err.message) || String(err), "error");
      }

      document.getElementById("search").addEventListener("click", function () {
        Homey.emit("pair_mode", "discovered")
          .then(function () { Homey.showView("list_devices"); })
          .catch(fail);
      });

      document.getElementById("probe").addEventListener("click", function () {
        Homey.showView("probe_id");
      });
    })();
  </script>
</body>
</html>
